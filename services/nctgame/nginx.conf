# nginx – reverse proxy pour NCTGame (WebSocket + REST)
# À copier dans /etc/nginx/sites-available/ puis lier dans sites-enabled/.
# Le bloc SSL (listen 443, certificats) sera ajouté automatiquement par certbot.
server {
    server_name @DOMAINE@;

    proxy_connect_timeout 300;
    proxy_send_timeout 300;
    proxy_read_timeout 3600;   # WebSocket : connexions longues
    send_timeout 3600;

    access_log /var/log/nginx/@DOMAINE@-access.log;
    error_log /var/log/nginx/@DOMAINE@-error.log;

    location / {
        proxy_pass http://127.0.0.1:@PORT@;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Montée en WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /health {
        proxy_pass http://127.0.0.1:@PORT@/health;
        access_log off;
    }

    listen 80;
}
